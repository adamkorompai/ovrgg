spring:
  application:
    name: ingestion-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Consumers declare the type they expect: no Java class name in the messages.
        spring.json.add.type.headers: false
    consumer:
      group-id: ingestion-service
      # A new consumer group starts from the oldest lookup still in the topic.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Wraps the JSON deserializer: an unreadable message goes to the error handler instead of looping forever.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: gg.ovr.common.player.PlayerLookupRequested
        spring.json.use.type.headers: false
    listener:
      # One thread per partition of player.lookup-requested.
      concurrency: 3

server:
  port: 8081

ovr:
  # fake | riot (riot: roadmap step 3)
  match-source: ${OVR_MATCH_SOURCE:fake}
  ingestion:
    match-count: 30
    processed-ttl: 30d
